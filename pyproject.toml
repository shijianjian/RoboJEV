[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robojev"
version = "0.1.0"
description = "A parallel decision model that controls a robot arm by answering questions about a text state"
readme = "README.md"
requires-python = ">=3.10"
# The package itself is stdlib plus numpy. Everything heavier is an extra, because the three
# things it is heavier *for* -- the simulator, the model, the trainer -- are mutually exclusive
# about their Python versions, and a unit test needs none of them.
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
# The simulator. LIBERO pulls robosuite and MuJoCo with it, and downloads its own assets on first
# use. It pins an older Python, so this extra is only installable on 3.10.
libero = ["libero @ git+https://github.com/Lifelong-Robot-Learning/LIBERO.git"]
# Serving a local checkpoint in-process. NanoJev's predictor wants a recent torch and CUDA; see
# README "Limits" for why this does not currently share an interpreter with `libero`.
model = ["torch>=2.4", "transformers>=4.44", "safetensors>=0.4", "huggingface-hub"]
dev = ["pytest>=7"]

[project.scripts]
robojev = "robojev.cli:main"

[tool.hatch.metadata]
# LIBERO is not on PyPI; the `libero` extra names its repository.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["robojev"]

[tool.hatch.build.targets.wheel.force-include]
"robojev/trainer" = "robojev/trainer"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sim: needs a simulator (LIBERO/MuJoCo) and is skipped without one",
    "gpu: needs a CUDA device and weights",
    "network: talks to a hosted API",
]
filterwarnings = ["ignore::DeprecationWarning"]
