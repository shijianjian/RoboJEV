name: pages

# The replay front end, built and published to GitHub Pages. It is a static site with no backend:
# `npm run build:pages` publishes the runs `web/showcase.json` selects (and the scene files those
# runs use) from `showcase/`, and nothing else, and builds the app without its Dataset
# tab (`VITE_SITE=pages`); `vite.config.ts` sets `base: "./"`,
# so a project site under `/RoboJEV/` works without any path configuration here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run waits rather than cancelling the one that is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The Pages build: the showcase runs only, and no Dataset tab (it needs a local console).
      - run: npm run build:pages
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
