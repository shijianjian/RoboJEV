name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Base dependencies only: numpy. The simulator, the model stack and the trainer's
      # environment are all extras, and the CPU suite must pass without any of them -- the
      # `sim`, `gpu` and `network` tests skip themselves (tests/conftest.py).
      - run: pip install -e ".[dev]"
      - run: python -c "import robojev; from robojev import skill, expert, policy; print(robojev.__version__)"
      - run: robojev --help
      - run: pytest -q -rs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
